spring.application.name=backend

# Load environment values from backend/.env if present
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Render/Heroku inject PORT; fall back to SERVER_PORT, then 8080
server.port=${PORT:${SERVER_PORT:8080}}

# Comma-separated frontend origins allowed by CORS (wildcards allowed, e.g. https://*.vercel.app)
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
